name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Linters, failing on any finding (R9, D24)
        run: |
          pip install ruff==0.16.9
          ruff check .
          npm install --no-save --no-package-lock eslint@9.39.5 @eslint/js@9.39.5 globals@16.5.0
          npx eslint .
      - run: python3 -I tools/check_repo.py
      - run: python3 -I tools/check_site.py
      - run: python3 -I tools/check_sources.py
  browser:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-browser.txt && python3 -m playwright install --with-deps chromium
      - run: python3 tools/check_browser.py
