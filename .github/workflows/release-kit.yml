name: release-kit
# Measure without tracking (D38): publish the Campaign kit's graphics pack as a GitHub release file, named by the tag in
# data/involve.json, so its total downloads can be counted with nothing on the portal. GitHub counts downloads in total
# only. This workflow only creates a release whose tag does not exist yet; it never edits, replaces or deletes one, so
# a download count is never reset. It fails closed if the tag is malformed or the built pack is not the one recorded.
on:
  push:
    branches: [main]
    paths: ["data/involve.json", "site/art/amplify-graphics-pack.zip"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release; nothing else
    steps:
      - uses: actions/checkout@v4
      - name: Publish the pack's release file if its tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          read_pr() { python3 -I -c "import json,sys; print(json.load(open('data/involve.json', encoding='utf-8'))['campaign']['pack_release'][sys.argv[1]])" "$1"; }
          tag=$(read_pr tag); want=$(read_pr sha256)
          [[ "$tag" =~ ^kit-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "release tag '$tag' is not kit-YYYY-MM-DD (S22)"; exit 1; }
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "no SHA-256 recorded for the pack (S22)"; exit 1; }
          got=$(sha256sum site/art/amplify-graphics-pack.zip | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "the built pack is not the one recorded in data/involve.json (S22)"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag already exists: nothing to do"; exit 0; fi
          printf '%s\n\n%s\n\n%s\n' \
            "The Amplify graphics pack as a release file, so its total downloads can be counted with no tracking on the portal. GitHub counts downloads in total only; Amplify never sees who downloaded it." \
            "SHA-256: $want" \
            "Amplify is independent and unofficial: not a service of the UK Youth Parliament, NYA or UK Parliament." > notes.md
          gh release create "$tag" site/art/amplify-graphics-pack.zip --title "Campaign kit: graphics pack ($tag)" --notes-file notes.md --target "$GITHUB_SHA"
